apiVersion: apps/v1
kind: Deployment
metadata:
  name: panier
  labels:
    app: panier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: panier
  template:
    metadata:
      labels:
        app: panier
    spec:
      containers:
        - name: panier
          # Remplacer DOCKERHUB_USER par le compte Docker Hub du groupe
          image: zakaria/panier:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: panier-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
