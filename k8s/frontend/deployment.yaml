apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Remplacer DOCKERHUB_USER par le compte Docker Hub du groupe
          image: DOCKERHUB_USER/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # Le frontend (nginx statique) n'a pas de /health : on teste "/"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
