# Ingress nginx : point d'entrée unique du cluster.
#
# Ingress 1 : routes /api/... (le préfixe est retiré avant d'atteindre le service)
#   /api/catalogue/products  ->  catalogue-service:3000  /products
#   /api/panier/cart/user1   ->  panier-service:3001     /cart/user1
#   /api/commandes/orders    ->  commandes-service:3002  /orders
#
# Ingress 2 : le frontend sur "/" (sans réécriture, sinon les pages seraient cassées)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/catalogue(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: catalogue-service
                port:
                  number: 3000
          - path: /api/panier(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: panier-service
                port:
                  number: 3001
          - path: /api/commandes(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: commandes-service
                port:
                  number: 3002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
