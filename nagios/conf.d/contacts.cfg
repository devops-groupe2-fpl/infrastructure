###############################################################################
# nagios/conf.d/contacts.cfg
# Qui est prévenu, et comment.
#
# Les notifications (service DOWN et retour UP) passent par notify-groupe2.sh :
#   1. toujours écrites dans /opt/nagios/var/groupe2-alerts.log
#   2. envoyées sur Slack si un webhook est configuré (voir docs/nagios-setup.md)
# Aucun secret n'est stocké dans ce fichier.
###############################################################################

define command {
    command_name    notify-service-groupe2
    command_line    /opt/nagios/libexec/notify-groupe2.sh "SERVICE" "$NOTIFICATIONTYPE$" "$HOSTNAME$" "$SERVICEDESC$" "$SERVICESTATE$" "$SERVICEOUTPUT$" "$LONGDATETIME$"
}

define command {
    command_name    notify-host-groupe2
    command_line    /opt/nagios/libexec/notify-groupe2.sh "HOTE" "$NOTIFICATIONTYPE$" "$HOSTNAME$" "-" "$HOSTSTATE$" "$HOSTOUTPUT$" "$LONGDATETIME$"
}

define contact {
    use                             generic-contact
    contact_name                    groupe2-admin
    alias                           Equipe DevOps Groupe 2
    email                           groupe2@example.com
    service_notification_options    c,u,r
    host_notification_options       d,r
    service_notification_commands   notify-service-groupe2
    host_notification_commands      notify-host-groupe2
}

define contactgroup {
    contactgroup_name   groupe2-admins
    alias               Admins Groupe 2
    members             groupe2-admin
}
