###############################################################################
# nagios/conf.d/hosts.cfg
# Hôte supervisé : le cluster Minikube (point d'entrée = Ingress nginx, port 80).
#
# MINIKUBE_IP est remplacé automatiquement par la sortie de `minikube ip`
# lors de ./scripts/start-nagios.sh.
###############################################################################

# Commande de vérification de l'hôte : le port 80 de l'Ingress répond-il ?
define command {
    command_name    groupe2-check-ingress
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p 80 -t 5
}

define host {
    use                     generic-host
    host_name               minikube
    alias                   Cluster Minikube (Ingress nginx)
    address                 MINIKUBE_IP
    check_command           groupe2-check-ingress
    check_period            24x7
    check_interval          2
    retry_interval          1
    max_check_attempts      2
    notification_period     24x7
    notification_interval   10
    notification_options    d,r
    contact_groups          groupe2-admins
}
