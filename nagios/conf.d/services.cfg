###############################################################################
# nagios/conf.d/services.cfg
# Un check HTTP par service, via l'Ingress (http://<minikube ip>/api/<service>/...).
# Un service est OK uniquement si la réponse contient le code 200.
###############################################################################

# $ARG1$ = chemin à tester
define command {
    command_name    groupe2-check-http
    command_line    $USER1$/check_http -I $HOSTADDRESS$ -p 80 -u $ARG1$ -e 200 -t 5
}

# Modèle commun à tous nos services
#   check_interval 2        -> vérification toutes les 2 minutes
#   retry_interval 1        -> après un échec, nouvelle vérification 1 min plus tard
#   max_check_attempts 1    -> un échec = état CRITICAL tout de suite
#   first_notification_delay 1 -> alerte envoyée 1 minute après le passage en CRITICAL
#   notification_options c,u,r -> alerte DOWN (critical/unknown) + retour UP (recovery)
define service {
    name                        groupe2-service
    use                         generic-service
    register                    0
    check_period                24x7
    check_interval              2
    retry_interval              1
    max_check_attempts          1
    first_notification_delay    1
    notification_period         24x7
    notification_interval       10
    notification_options        c,u,r
    contact_groups              groupe2-admins
}

define service {
    use                     groupe2-service
    host_name               minikube
    service_description     Catalogue
    check_command           groupe2-check-http!/api/catalogue/health
}

define service {
    use                     groupe2-service
    host_name               minikube
    service_description     Panier
    check_command           groupe2-check-http!/api/panier/health
}

define service {
    use                     groupe2-service
    host_name               minikube
    service_description     Commandes
    check_command           groupe2-check-http!/api/commandes/health
}

# Le frontend (nginx statique) n'a pas de /health : on teste la page d'accueil.
define service {
    use                     groupe2-service
    host_name               minikube
    service_description     Frontend
    check_command           groupe2-check-http!/
}
